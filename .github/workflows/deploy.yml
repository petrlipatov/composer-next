name: Deploy to Production Server

# Запускать этот workflow при каждом пуше в ветку main
on:
  push:
    branches:
      - main

jobs:
  # Первое задание: собрать и отправить Docker-образ
  build-and-update-image:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Логинимся в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Собираем и отправляем образ
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: peterlipatov/composer-v2-production:latest

  # Второе задание: задеплоить на сервере (запустится после первого)
  deploy-on-server:
    needs: build-and-update-image
    runs-on: ubuntu-latest
    steps:
      # 1. Подключаемся к серверу по SSH и выполняем команды
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/liza-app
            docker pull peterlipatov/composer-v2-production:latest
            docker compose up -d
            echo "Deployment finished successfully!"
